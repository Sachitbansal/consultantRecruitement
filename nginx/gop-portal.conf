# GOP Consultant Recruitment Portal — nginx server block
#
# Goes on the SERVER (not the dev box), at:
#   /etc/nginx/sites-available/gop-portal.conf
# then symlink it:
#   ln -s /etc/nginx/sites-available/gop-portal.conf /etc/nginx/sites-enabled/
#
# Assumes the Docker stack is running on the same server with the app
# published on 127.0.0.1:8001 (see APP_PORT in .env).
#
# ---------------------------------------------------------------------------
# BEFORE YOU START
#   1. Replace gop.example.com below with the real domain/subdomain.
#   2. Point that domain's DNS A record at this server's public IP FIRST —
#      certbot cannot issue a certificate until DNS resolves here.
#   3. Deploy this file with the HTTP block only, reload nginx, then run:
#        sudo certbot --nginx -d gop.example.com
#      Certbot rewrites this file to add the TLS block and the redirect.
#      If you prefer to manage it by hand, the HTTPS block below is what
#      the finished file should look like — uncomment it after the certs
#      exist at the paths shown.
#   4. AFTER TLS is live, set FORCE_INSECURE_COOKIES=false in .env and run
#      `docker compose up -d` — otherwise admin session cookies keep being
#      sent without the Secure flag.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name gop.example.com;

    # Certbot's ACME challenge. Keep this reachable over plain HTTP even
    # after TLS is live, or renewals fail.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Once certbot has issued the cert, everything else goes to HTTPS.
    # Certbot adds this automatically; uncomment if configuring by hand.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # CV uploads are capped at 10MB server-side in the app. nginx's default
    # is 1MB, which would reject them with a 413 before the app ever sees
    # the request. 12M leaves headroom for multipart overhead.
    client_max_body_size 12M;
}

