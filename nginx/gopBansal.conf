# GOP Consultant Recruitment Portal
#
# /etc/nginx/sites-available/gopBansal.conf
# ln -s /etc/nginx/sites-available/gopBansal.conf /etc/nginx/sites-enabled/
#
# Docker stack publishes the app on 127.0.0.1:8001 (APP_PORT in .env).
#
# Deploy as-is (port 80 only), reload nginx, confirm:
#   curl -I -H "Host: gop.sbssdigital.com" http://127.0.0.1/     -> 200
# then:
#   sudo certbot --nginx -d gop.sbssdigital.com
# Certbot rewrites this file — adds the 443 block, cert paths, and the
# HTTP->HTTPS redirect — same as it did for sae.conf.
#
# AFTER certbot succeeds, set FORCE_INSECURE_COOKIES=false in .env and run
# `docker compose up -d`, or admin session cookies keep going out without
# the Secure flag.

server {
        listen 80;
        server_name gop.sbssdigital.com;

        # Candidate CVs are capped at 10MB in the app. nginx defaults to 1MB,
        # which would 413 every upload before the app ever sees it.
        client_max_body_size 12M;

        location / {
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass http://127.0.0.1:8001;

                # xlsx exports and CV downloads can run long on big result sets.
                proxy_read_timeout 120s;
        }
}

# ---------------------------------------------------------------------------
# OPTIONAL — admin login brute-force limit at the proxy layer.
#
# The app has its own limiter, but it keys off X-Forwarded-For, which a client
# can forge. Behind nginx that header becomes trustworthy; this block adds a
# second limit on top.
#
# To enable, BOTH steps are required:
#   1. Add this line to /etc/nginx/nginx.conf inside the http { } block:
#        limit_req_zone $binary_remote_addr zone=gop_login:10m rate=10r/m;
#   2. Move the location block below inside the server { } block above.
#
# Doing step 2 without step 1 makes `nginx -t` fail and the reload is refused,
# leaving the old config silently running.
#
#        location = /api/admin/login {
#                limit_req zone=gop_login burst=5 nodelay;
#
#                proxy_set_header Host $host;
#                proxy_set_header X-Real-IP $remote_addr;
#                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#                proxy_set_header X-Forwarded-Proto $scheme;
#                proxy_pass http://127.0.0.1:8001;
#        }
# ---------------------------------------------------------------------------

